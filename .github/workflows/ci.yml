name: CI

# Ne zaman çalışır: main'e itilen her commit'te, her pull request'te ve
# Actions sekmesinden elle başlatıldığında.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Aynı dalda üst üste itme olursa eski çalışmayı iptal et — macOS dakikaları
# ücretlidir, gereksiz koşuyu sonuna kadar götürmenin anlamı yok.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1) Statik denetim — Ubuntu'da saniyeler sürer, macOS kuyruğunu beklemez.
  #    Yerelleştirme eşliği, kaynak yapısı, plist ve doküman ağacı burada
  #    kontrol edilir; hata varsa pahalı macOS işi hiç başlatılmaz.
  # ------------------------------------------------------------------
  static-checks:
    name: Statik denetim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Statik denetimi çalıştır
        env:
          CHECK_REPORT: static-check.txt
        run: python3 scripts/static_check.py

      # Tampon göstergesinin karar mantığı. Swift derleyicisi olmadan
      # doğrulanamayan bu akış burada, birebir Python portu üzerinden sınanır.
      # Neden CI'da: mantık "ileri sarınca yüklenmiyor" kusurunun düzeltmesidir
      # ve sessizce bozulursa kullanıcı yine donmuş kareye bakar.
      - name: Tampon göstergesi mantığını sına
        run: python3 scripts/seek_mantik_testi.py

      - name: Raporu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-check-report
          path: static-check.txt
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 2) Gerçek derleme. macOS runner'ı Xcode ile birlikte gelir.
  #    Belirli bir simülatör adı yerine "generic/platform=iOS Simulator"
  #    kullanılır: cihaz adları runner imajıyla değişir, bu hedef değişmez.
  #
  #    `macos-14` yerine `macos-15` seçildi: macOS 14 imajı kullanımdan
  #    kaldırılmış durumda ve beraberinde yalnızca Xcode 15.x taşıyor. Ayrıca
  #    Xcode 15'in iOS 18+ simülatör çalışma zamanı yok; bu da test işinde
  #    cihaz bulunamamasına yol açıyordu. macOS 15 imajı Xcode 16.x ile gelir
  #    ve iOS 18 çalışma zamanını içerir.
  # ------------------------------------------------------------------
  build:
    name: Derleme ve IPA Üretimi
    runs-on: macos-15
    needs: static-checks
    env:
      # İmzasız derleme. Bu üç ayar olmadan xcodebuild bir geliştirici
      # sertifikası arar ve CI'da başarısız olur. Ayarlar komut satırından
      # verilir, `project.yml` içine yazılmaz; böylece yerel imzalama bozulmaz.
      SIGNING: CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
    steps:
      - uses: actions/checkout@v4

      - name: Xcode sürümü ve kullanılabilir simülatörler
        run: |
          xcodebuild -version
          xcrun simctl list devices available | sed -n '1,40p'

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini üret
        run: xcodegen generate

      # VLCKit ikilisi ~920 MB. Önbellek olmadan her koşu bunu yeniden indirir:
      # derleme adımının çoğu beklemeyle geçer ve macOS dakikaları ücretlidir.
      # Anahtar `project.yml` içeriğine bağlıdır; paket sürümü değişirse
      # (`exactVersion`) önbellek kendiliğinden geçersiz olur ve temiz indirme
      # yapılır. Geri yükleme anahtarı sürüme bağlı, kaydetme anahtarı ise
      # `restore-keys` ile her koşuda tazelenir: böylece paket deposu bir kez
      # inip sonraki koşularda yerinde kalır.
      - name: VLCKit paketini önbelleğe al
        uses: actions/cache@v4
        with:
          path: package-cache
          key: vlckit-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            vlckit-${{ runner.os }}-

      - name: Paket bağımlılıklarını çöz
        run: |
          xcodebuild -project IPiOS.xcodeproj \
            -scheme IPiOS \
            -clonedSourcePackagesDirPath package-cache \
            -resolvePackageDependencies

      - name: Üretilen projeyi doğrula
        run: |
          test -d IPiOS.xcodeproj || { echo "::error::IPiOS.xcodeproj üretilmedi"; exit 1; }

          # `project.yml` içindeki `projectFormat: xcode15_3` objectVersion 63
          # üretir. Bu ayar bir gün düşerse XcodeGen varsayılanına (xcode16_0 →
          # objectVersion 77) döner ve Xcode 15.x projeyi açamaz. O durumda
          # xcodebuild "gelecekteki bir Xcode sürümüyle üretilmiş" der ama
          # hangi ayarın sorumlu olduğunu söylemez; bu yüzden burada erken,
          # anlaşılır bir hatayla durdurulur.
          PBX=IPiOS.xcodeproj/project.pbxproj
          if ! grep -q 'objectVersion = 63' "$PBX"; then
            echo "::error::$PBX içinde objectVersion = 63 bulunamadı. project.yml içindeki 'projectFormat: xcode15_3' ayarını kontrol edin."
            grep -n 'objectVersion' "$PBX" || true
            exit 1
          fi

          xcodebuild -list -project IPiOS.xcodeproj

      - name: Derle (Simülatör)
        run: |
          xcodebuild -project IPiOS.xcodeproj \
            -scheme IPiOS \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath package-cache \
            $SIGNING \
            build

      # `package-cache` her iki derlemede de verilir. Verilmezse xcodebuild
      # paketi yeniden çözer ve indirir — yani önbellekten kazanılan süre
      # ikinci derlemede geri kaybedilir.
      - name: IPA oluştur ve paketle (iOS Cihaz)
        run: |
          xcodebuild -project IPiOS.xcodeproj \
            -scheme IPiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath package-cache \
            $SIGNING \
            build

          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/IPiOS.app build/Payload/
          cd build && zip -r -q IPiOS.ipa Payload

      - name: IPA dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: IPiOS-ipa
          path: build/IPiOS.ipa
          if-no-files-found: error
          retention-days: 14

      # Hangi Xcode ile derlendiği, derleme başarısız olduğunda ilk bakılacak
      # bilgidir; bu yüzden adım `if: always()` ile her koşulda çalışır.
      - name: Hata ayıklama için Xcode sürümünü kaydet
        if: always()
        run: xcodebuild -version > xcode-version.txt

      - name: Xcode sürümünü yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-version
          path: xcode-version.txt
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 3) Birim testleri. Simülatör adı sabit yazılmaz; runner'da kurulu
  #    cihazlar arasından sırayla denenip ilk bulunan kullanılır. Böylece
  #    Apple imajı güncelleyip bir cihazı kaldırdığında iş kırılmaz.
  #
  #    Liste en yeni cihazdan geriye doğru sıralıdır: macOS 15 imajı Xcode
  #    16.x ile geldiği için iPhone 16 / iPad Pro (M4) artık gerçekten
  #    kurulu. Eski adlar yedek olarak duruyor, tek bir cihaz bulunamazsa
  #    iş anlaşılır bir hatayla durur.
  # ------------------------------------------------------------------
  test:
    name: Birim testleri
    runs-on: macos-15
    needs: build
    env:
      SIGNING: CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini üret
        run: xcodegen generate

      - name: VLCKit paketini önbelleğe al
        uses: actions/cache@v4
        with:
          path: package-cache
          key: vlckit-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            vlckit-${{ runner.os }}-

      - name: Testleri çalıştır
        run: |
          set -euo pipefail

          # Tercih sırası: en yeni cihazdan geriye. Kurulu olan ilk cihaz seçilir.
          ADAYLAR=(
            "iPhone 16 Pro" "iPhone 16" "iPhone 15 Pro" "iPhone 15"
            "iPhone SE (3rd generation)" "iPhone 14"
            "iPad Pro 11-inch (M4)" "iPad Pro (11-inch) (4th generation)"
            "iPad Air (5th generation)" "iPad (10th generation)"
          )

          SECILEN=""
          for ad in "${ADAYLAR[@]}"; do
            if xcrun simctl list devices available | grep -qF "$ad ("; then
              SECILEN="$ad"
              break
            fi
          done

          if [ -z "$SECILEN" ]; then
            echo "::error::Kullanılabilir simülatör bulunamadı"
            xcrun simctl list devices available
            exit 1
          fi

          echo "Seçilen simülatör: $SECILEN"
          echo "### Seçilen simülatör: $SECILEN" >> "$GITHUB_STEP_SUMMARY"
          xcodebuild -project IPiOS.xcodeproj \
            -scheme IPiOS \
            -destination "platform=iOS Simulator,name=$SECILEN" \
            -clonedSourcePackagesDirPath package-cache \
            $SIGNING \
            test

      - name: Test sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.xcresult'
          if-no-files-found: ignore
          retention-days: 7
