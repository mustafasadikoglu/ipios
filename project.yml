name: IPiOS
options:
  bundleIdPrefix: com.mustafa.ipios
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # XcodeGen varsayılanı `xcode16_0` (project objectVersion 77). Bu biçimi
  # yalnızca Xcode 16+ açabilir; Xcode 15.x "gelecekteki bir Xcode sürümüyle
  # üretilmiş" diyerek projeyi reddeder. `xcode15_3` objectVersion 63 ve
  # compatibilityVersion "Xcode 15.3" üretir; Xcode 15.3'ten 26.x'e kadar
  # tüm sürümler okur. Ayrıntı: docs/MIMARI.md
  projectFormat: xcode15_3

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  IPiOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: IPiOS
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mustafa.ipios
        PRODUCT_NAME: IPiOS
        INFOPLIST_FILE: IPiOS/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES

  IPiosTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: IPiosTests
    dependencies:
      - target: IPiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mustafa.ipios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  IPiOS:
    build:
      targets:
        IPiOS: all
        IPiosTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IPiosTests
