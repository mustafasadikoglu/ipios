name: IPiOS
options:
  bundleIdPrefix: com.mustafa.ipios
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # XcodeGen varsayılanı `xcode16_0` (project objectVersion 77). Bu biçimi
  # yalnızca Xcode 16+ açabilir; Xcode 15.x "gelecekteki bir Xcode sürümüyle
  # üretilmiş" diyerek projeyi reddeder. `xcode15_3` objectVersion 63 ve
  # compatibilityVersion "Xcode 15.3" üretir; Xcode 15.3'ten 26.x'e kadar
  # tüm sürümler okur. Ayrıntı: docs/MIMARI.md
  projectFormat: xcode15_3

# --------------------------------------------------------------------------
# Oynatma çekirdeği: VideoLAN'ın kendi VLCKit paketi.
#
# Neden gerekli: ölçüm kesin bir sonuç verdi — sağlayıcı filmleri ve dizileri
# **yalnızca Matroska (.mkv)** olarak sunuyor. `AVFoundation`'ın Matroska
# demuxer'ı yoktur; bu bir uygulama kusuru değil, çerçeve sınırıdır. Uzantıyı
# değiştirmek de kurtarmaz: sunucu `.mp4`/`.m3u8` adreslerinde gövdeyi boş
# döndürüyor. Bu yüzden eksik olan şey yedek bir adres değil, bir **demuxer**'dır
# (bkz. docs/MIMARI.md Bölüm 11 ve scripts/xtream_teshis.py).
#
# Kaynak olarak `videolan/vlckit` kullanılır: indirme adresi VideoLAN'ın kendi
# sunucusudur ve paket doğrudan resmî derlemeyi çeker. Üçüncü taraf "umbrella"
# depolar (ör. birinin S3 kovasına yüklediği ikili) bilinçli olarak tercih
# edilmedi; CI her koşuda bu adrese gider ve adres bir gün kaybolursa derleme
# kırılır.
#
# `exactVersion` **zorunlu**: VideoLAN'ın etiketleri tutarsız biçimde
# (`4.0.0a21` geçersiz, `4.0.0-a24` geçerli semver) atıldığı için bir sürüm
# aralığı verildiğinde SwiftPM geçerli en yüksek etiketi kendi seçer ve
# beklenmedik bir derlemeye düşebilir. 4.0.0-a24, Swift 5.9 araç zinciriyle
# uyumlu ve iOS 12+ hedefini destekler.
packages:
  VLCKit:
    url: https://github.com/videolan/vlckit
    exactVersion: 4.0.0-a24

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  IPiOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: IPiOS
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: VLCKit
        product: VLCKit
    settings:
      base:
        # libvlc, C++ çalışma zamanına ve paketin kendi bağlantı ayarlarında
        # bildirdiği sistem kütüphanelerine dayanır. SwiftPM'in
        # `linkerSettings` bildirimi XcodeGen'in ürettiği projeye her zaman
        # yansımadığı için burada açıkça verilir; eksik olduğunda derleme
        # "Undefined symbols" ya da çalışma anında "dylib yüklenemedi" ile
        # düşer ve nedeni görünmez.
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
          - "-lz"
          - "-lbz2"
          - "-lxml2"
          - "-liconv"
        PRODUCT_BUNDLE_IDENTIFIER: com.mustafa.ipios
        PRODUCT_NAME: IPiOS
        INFOPLIST_FILE: IPiOS/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES

  IPiosTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: IPiosTests
    dependencies:
      - target: IPiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mustafa.ipios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  IPiOS:
    build:
      targets:
        IPiOS: all
        IPiosTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IPiosTests
